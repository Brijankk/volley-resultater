[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyball-resultater"
version = "1.0.1"
description = "Scrape and normalize Danish volleyball league results from resultater.volleyball.dk."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scrape-volleyball = "volleyball_resultater.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volleyball_resultater = ["rule_assignments.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
