<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volleyball Danmark Resultater</title>
    <meta name="theme-color" content="#0b6b78" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Volley DK" />
    <meta
      name="description"
      content="Se stillinger, sæsonudvikling og resultater for danske volleyballrækker."
    />
    <link rel="stylesheet" href="./styles.css?v=1.1.0" />
    <link rel="manifest" href="./manifest.webmanifest?v=1.1.0" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <div class="meta-row">
            <p class="eyebrow">Volleyball Danmark</p>
            <div class="app-version" aria-label="Version">v1.1.0</div>
          </div>
          <h1>Resultater</h1>
        </div>
        <div class="topbar-actions">
          <button class="install-button hidden" id="installButton" type="button">Installer</button>
          <div class="status-pill" id="status">Indlæser data</div>
          <div class="status-pill hidden" id="connectionStatus"></div>
          <div class="status-pill hidden" id="updatedStatus"></div>
        </div>
      </header>

      <section class="selector-band" aria-label="Valg af række">
        <label class="field">
          <span>Sæson</span>
          <select id="seasonSelect"></select>
        </label>

        <fieldset class="segmented" id="genderControl">
          <legend>Køn</legend>
        </fieldset>

        <label class="field">
          <span>Række</span>
          <select id="leagueSelect"></select>
        </label>

        <label class="field pool-field" id="poolField">
          <span>Pulje</span>
          <select id="poolSelect"></select>
        </label>
      </section>

      <section class="content-grid">
        <section class="panel standings-panel">
          <div class="section-heading">
            <h2>Stilling</h2>
          </div>
          <div class="table-scroll">
            <table class="standings-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Hold</th>
                  <th>P</th>
                  <th>K</th>
                  <th>V</th>
                  <th>T</th>
                  <th>Sæt</th>
                  <th>Bolde</th>
                </tr>
              </thead>
              <tbody id="standingsBody"></tbody>
            </table>
          </div>
        </section>

        <section class="validation-meta hidden" id="validationMeta" aria-label="Validering af stilling"></section>

        <section class="panel chart-panel">
          <div class="section-heading chart-heading">
            <h2>Sæsonudvikling</h2>
            <div class="segmented small" id="chartModeControl" aria-label="Diagramvisning">
              <button type="button" data-mode="game" class="active">Kampe</button>
              <button type="button" data-mode="date">Datoer</button>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="pointsChart" width="900" height="520"></canvas>
          </div>
          <div class="legend" id="chartLegend"></div>
        </section>
      </section>

      <section class="panel matrix-panel">
        <div class="section-heading">
          <h2>Hjemme / ude</h2>
        </div>
        <div class="matrix-scroll" id="matrixWrap"></div>
      </section>

      <section class="panel detail-panel" id="matchDetailPanel">
        <div class="section-heading">
          <h2>Kampdetaljer</h2>
        </div>
        <div id="matchDetailContent" class="match-detail-empty">
          Vælg en kamp i matrixen.
        </div>
      </section>

      <section class="panel schedule-panel">
        <div class="section-heading schedule-heading">
          <h2>Kampprogram</h2>
          <div class="schedule-filters" aria-label="Filtrering af kampprogram">
            <div class="segmented small schedule-range-control" id="scheduleRangeControl" aria-label="Kampe">
              <button type="button" data-range="nearby" class="active">Nuværende</button>
              <button type="button" data-range="all">Alle</button>
            </div>
            <label class="field compact-field">
              <span>Hold</span>
              <select id="scheduleTeamSelect"></select>
            </label>
            <div class="segmented small schedule-side-control hidden" id="scheduleSideControl" aria-label="Hjemme eller ude">
              <button type="button" data-side="all" class="active">Alle</button>
              <button type="button" data-side="home">Hjemme</button>
              <button type="button" data-side="away">Ude</button>
            </div>
          </div>
        </div>
        <div class="table-scroll schedule-scroll">
          <table class="schedule-table">
            <colgroup>
              <col class="schedule-date-col" />
              <col class="schedule-team-col" />
              <col class="schedule-team-col" />
              <col class="schedule-venue-col" />
              <col class="schedule-result-col" />
            </colgroup>
            <thead>
              <tr>
                <th>Dato</th>
                <th>Hjemmehold</th>
                <th>Udehold</th>
                <th>Spillested</th>
                <th>
                  <span class="desktop-label">Resultat</span>
                  <span class="mobile-label">Res.</span>
                </th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
        <p class="schedule-empty hidden" id="scheduleEmpty">Ingen kampe matcher filtrene.</p>
      </section>

    </main>

    <script src="./app.js?v=1.1.0" type="module"></script>
  </body>
</html>
